<style>

function home(){
  const picks=[...ALL].sort((a,b)=>b.y-a.y).slice(0,5);
  $("v").innerHTML=`<section class="hero">${picks.map((m,i)=>`<div class="slide${i?"":" on"}"><div class="bg" style="background:${grad(m.h)}"></div><div class="hc"><small>${m.c} · ${m.y}</small><h1 class="disp">${m.t}</h1><p>${m.syn}</p><div class="row2"><button class="btn" data-k="${enc(key(m))}">تفاصيل الفيلم</button><a class="btn2" href="#/c/${enc(m.c)}">كل أفلام ${m.c}</a></div></div></div>`).join("")}<div class="dots">${picks.map((_,i)=>`<button class="${i?"":"on"}" aria-label="شريحة ${i+1}"></button>`).join("")}</div></section>`+
  CATS.map(c=>`<section class="sec"><div class="sh"><h2 class="disp">${c}</h2><a href="#/c/${enc(c)}">عرض الكل</a></div><div class="strip">${ALL.filter(m=>m.c===c).slice(0,10).map(card).join("")}</div></section>`).join("");
  wire();document.querySelectorAll(".hc .btn").forEach(b=>b.onclick=()=>location.hash="#/m/"+b.dataset.k);
  const s=document.querySelectorAll(".slide"),d=document.querySelectorAll(".dots button");let i=0;
  const go=n=>{i=n;s.forEach((x,j)=>x.classList.toggle("on",j===i));d.forEach((x,j)=>x.classList.toggle("on",j===i))};
  const rs=()=>{clearInterval(timer);timer=setInterval(()=>go((i+1)%s.length),5000)};
  d.forEach((b,j)=>b.onclick=()=>{go(j);rs()});rs();
}
function cat(c){
  const l=ALL.filter(m=>m.c===c);if(!l.length)return $("v").innerHTML=`<div class="empty">التصنيف مش موجود.</div>`;
  const f=l[0];
  $("v").innerHTML=`<section class="feat"><div class="poster disp" style="background:${grad(f.h)}">${f.t}</div><div style="flex:1;min-width:240px"><small>فيلم مميز في ${c}</small><h1 class="disp">${f.t}</h1><p class="mut">${f.syn}</p><p class="mut">${f.y} · ${f.m} دقيقة</p><button class="btn" data-k="${enc(key(f))}">تفاصيل الفيلم</button></div></section><div class="sec"><div class="sh"><h2 class="disp">باقي أفلام ${c}</h2></div></div><div class="grid">${l.slice(1).map(card).join("")}</div>`;
  wire();document.querySelector(".feat .btn").onclick=e=>location.hash="#/m/"+e.target.dataset.k;
}
function grid(title,l,msg){$("v").innerHTML=`<div class="sec"><h1 class="disp">${title}</h1><p class="mut">${l.length} فيلم</p></div>${l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="empty">${msg}</div>`}`;wire()}
function movie(k){
  const m=ALL.find(x=>key(x)===k);if(!m)return $("v").innerHTML=`<div class="empty">الفيلم مش موجود.</div>`;
  const on=!!list[k];
  $("v").innerHTML=`<div class="det"><div class="poster disp" style="background:${grad(m.h)}">${m.t}</div><div class="info"><small>${m.c}</small><h1 class="disp">${m.t}</h1><div class="tags"><span class="tag">${m.y}</span><span class="tag">${m.m} دقيقة</span></div><p>${m.syn}</p><button class="btn" id="lb">${on?"في قائمتي ✓":"أضف لقائمتي"}</button> <a class="btn2" href="#/c/${enc(m.c)}">أفلام ${m.c} تانية</a><h3 class="disp" style="margin-top:26px">مقطع تعريفي</h3><div class="vid" id="vid" role="button" tabindex="0" aria-label="تشغيل المقطع"><div class="pl">▶</div></div></div></div>`;
  $("lb").onclick=()=>{list[k]=!list[k];saveList();$("lb").textContent=list[k]?"في قائمتي ✓":"أضف لقائمتي"};
  const v=$("vid"),play=()=>{if(v.querySelector("canvas"))return;v.innerHTML="<canvas></canvas>";teaser(v.firstChild,m)};
  v.onclick=play;v.onkeydown=e=>{if(e.key==="Enter")play()};
}
function teaser(cv,m){
  cv.width=cv.clientWidth;cv.height=cv.clientHeight;const x=cv.getContext("2d");
  const P=Array.from({length:70},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*2+.5,s:Math.random()*.7+.2}));
  const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;let t=0;
  (function f(){
    x.fillStyle=`hsl(${m.h} 45% 8%)`;x.fillRect(0,0,cv.width,cv.height);
    const g=x.createLinearGradient(0,0,cv.width,cv.height);g.addColorStop(0,`hsla(${m.h},60%,32%,.55)`);g.addColorStop(1,`hsla(${(m.h+60)%360},60%,18%,.4)`);x.fillStyle=g;x.fillRect(0,0,cv.width,cv.height);
    P.forEach(p=>{x.fillStyle="rgba(242,183,5,.5)";x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();if(!rm){p.y-=p.s;if(p.y<-5)p.y=cv.height+5}});
    x.fillStyle="#f3eefc";x.textAlign="center";x.font="700 "+Math.max(18,cv.width/16)+"px 'Reem Kufi',sans-serif";x.fillText(m.t,cv.width/2,cv.height/2);
    x.font="400 14px Tajawal,sans-serif";x.fillStyle="#a79bc4";x.fillText("هنا يتحط التريلر الحقيقي",cv.width/2,cv.height/2+30);
    if(!rm&&cv.isConnected)requestAnimationFrame(f);
  })();
}
function route(){
  if(!authed)return;clearInterval(timer);
  const p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.c===(p[0]==="c"?p[1]:p[0]==="list"?"list":"")));
  scrollTo(0,0);
  if(p[0]==="c")cat(p[1]);
  else if(p[0]==="m")movie(p[1]);
  else if(p[0]==="s"){const q=p[1].toLowerCase();grid("نتائج «"+p[1]+"»",ALL.filter(m=>m.t.toLowerCase().includes(q)),"مفيش نتائج. جرّب اسم تاني.")}
  else if(p[0]==="list")grid("قائمتي",ALL.filter(m=>list[key(m)]),"لسه مفيش أفلام. ادخل على أي فيلم ودوس «أضف لقائمتي».");
  else home();
}
addEventListener("hashchange",route);
</script>
</body>
</html>
