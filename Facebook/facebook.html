  <!-- نافذة عرض الستوري الكبيرة (Modal) -->
<div id="storyModal" class="story-modal">
  <span class="close-modal">&times;</span>
  <img class="modal-content" id="modalImage" alt="Zoomed Story">
  <div id="modalCaption" class="modal-caption"></div>
</div>

<!-- كود الجافاسكربت -->
<script>
    const modal = document.getElementById("storyModal");
    const modalImg = document.getElementById("modalImage");
    const modalCaption = document.getElementById("modalCaption");
    const closeBtn = document.querySelector(".close-modal");
    const storyCards = document.querySelectorAll(".story-card");

    // الكود ده بيمسك الـ 10 ستوريات أوتوماتيك من غير ما تعدلي فيهم حاجة
    storyCards.forEach(card => {
      card.addEventListener("click", () => {
        const imgElement = card.querySelector(".story-bg");
        const nameElement = card.querySelector(".story-name");
        
        // إظهار النافذة
        modal.style.display = "flex";
        
        // نقل صورة الاستوري واسم صاحبتها للنافذة الكبيرة
        modalImg.src = imgElement.src;
        modalCaption.textContent = nameElement.textContent;
      });
    });

    // زر إغلاق النافذة (X)
    closeBtn.addEventListener("click", () => {
      modal.style.display = "none";
    });

    // لو دوستي في أي مكان فاضي بالأسود تقفل النافذة
    window.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
      }
    });
</script>

      <!-- 1. كود جافاسكربت مكتبة MDB -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"></script>

    <!-- 2. كود الجافاسكربت (القديم بتاع الستوريات + الجديد بتاع نافذة البوست مع بعض) -->
    <script>
        // --- كود الستوريات القديم ---
        const modal = document.getElementById("storyModal");
        const modalImg = document.getElementById("modalImage");
        const modalCaption = document.getElementById("modalCaption");
        const closeBtn = document.querySelector(".close-modal");
        const storyCards = document.querySelectorAll(".story-card");

        storyCards.forEach(card => {
          card.addEventListener("click", () => {
            const imgElement = card.querySelector(".story-bg");
            const nameElement = card.querySelector(".story-name");
            modal.style.display = "flex";
            modalImg.src = imgElement.src;
            modalCaption.textContent = nameElement.textContent;
          });
        });

        if (closeBtn) {
          closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
          });
        }

        window.addEventListener("click", (e) => {
          if (e.target === modal) {
            modal.style.display = "none";
          }
        });

        const avatarLinks = document.querySelectorAll(".story-avatar-link");
        avatarLinks.forEach(link => {
          link.addEventListener("click", (e) => {
            e.stopPropagation();
          });
        });
    </script>




<script>
    // زرار إغلاق نافذة البوست (علامة X)
    const closePostBtn = document.querySelector(".close-post-modal");
    const postModal = document.getElementById("postModal");
    const publishBtn = document.getElementById("publishBtn");
    const postTextarea = document.getElementById("postTextarea");

    if (closePostBtn) {
      closePostBtn.addEventListener("click", () => {
        postModal.style.display = "none";
      });
    }

    // إغلاق النافذة لو دوستي في أي مكان فاضي بره الصندوق
    window.addEventListener("click", (e) => {
      if (e.target === postModal) {
        postModal.style.display = "none";
      }
    });

    // زرار النشر
    if (publishBtn) {
      publishBtn.addEventListener("click", () => {
        const postContent = postTextarea.value.trim();
        if (postContent !== "") {
          alert("تم نشر بوستك بنجاح: " + postContent);
          postTextarea.value = "";
          postModal.style.display = "none";
        } else {
          alert("الرجاء كتابة شيء قبل النشر!");
        }
      });
    }
</script>
